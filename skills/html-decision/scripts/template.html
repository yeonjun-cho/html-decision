<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  {{MERMAID_SCRIPT}}
  <style>
:root {
  --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;

  --bg: #fafafa; --card: #fff;
  --border: #e5e7eb; --border-soft: #f3f4f6;
  --text: #1f2937; --muted: #6b7280;
  --accent: #2563eb;

  --info: #0969da;      --info-bg: #ddf4ff;       --info-dark: #0c3a6e;
  --tip: #1a7f37;       --tip-bg: #dafbe1;        --tip-dark: #0f5223;
  --important: #8250df; --important-bg: #fbefff;  --important-dark: #4f1a8a;
  --warning: #9a6700;   --warning-bg: #fff8c5;    --warning-dark: #5b3a00;
  --danger: #cf222e;    --danger-bg: #ffebe9;     --danger-dark: #730d18;
  --note: #59636e;      --note-bg: #f6f8fa;

  --low: #16a34a; --low-bg: #dcfce7;
  --mid: #ca8a04; --mid-bg: #fef3c7;
  --high: #dc2626; --high-bg: #fee2e2;

  --rec: #10b981; --rec-bg: #f0fdf4; --rec-bg-soft: #f7fee7; --rec-dark: #065f46;
}
* { box-sizing: border-box; }
html { font-size: 16px; }

body {
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.7;
  letter-spacing: -0.01em;
  word-break: keep-all;
  overflow-wrap: anywhere;
  color: var(--text);
  background: var(--bg);
  margin: 0;
  display: flex;
  min-height: 100vh;
}

h1, h2, h3, h4, h5 { font-family: inherit; }

/* sidebar — 순수 목차 only */
.sidebar {
  position: sticky; top: 0; height: 100vh; width: 240px;
  flex-shrink: 0; padding: 28px 18px; background: var(--card);
  border-right: 1px solid var(--border); overflow-y: auto; font-size: 0.86em;
}
.sidebar-title {
  font-size: 0.68em; color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 8px;
}
.sidebar-title:not(:first-child) { margin-top: 24px; }
.progress-bar-wrap {
  background: var(--border-soft); height: 6px; border-radius: 3px;
  overflow: hidden; margin-bottom: 6px;
}
.progress-bar {
  height: 100%; background: linear-gradient(90deg, var(--rec), #059669);
  width: 0%; transition: width 0.3s;
}
.progress-text { font-size: 0.82em; color: var(--muted); margin: 0; }
.nav-list { list-style: none; padding: 0; margin: 0; }
.nav-list li { margin: 1px 0; }
.nav-list a {
  display: block; padding: 8px 10px; color: var(--text);
  text-decoration: none; font-size: 0.85em; border-radius: 5px;
  border-left: 2px solid transparent; transition: background 0.1s;
  line-height: 1.4;
}
.nav-list a:hover { background: var(--border-soft); }
.nav-list a.active {
  background: var(--rec-bg); border-left-color: var(--rec);
  color: var(--rec-dark); font-weight: 500;
}
.nav-list a.answered::before { content: "✓ "; color: var(--rec); font-weight: 600; }

/* main — sidebar 다음 가용 폭 활용 + 본문 prose 만 좁게 */
.main { flex: 1; max-width: 1200px; margin: 0 auto; padding: 36px 48px 80px; min-width: 0; }
/* prose 영역 — 한글 가독성 (40-60자/줄) */
.bg-card, .q-why, .q-rec, .q-desc, .callout p, .question > p { max-width: 70ch; }
h1 {
  margin: 0 0 6px; font-size: 1.75rem; font-weight: 700;
  line-height: 1.3; letter-spacing: -0.02em;
}
.meta { font-size: 0.86em; color: var(--muted); margin: 0 0 24px; line-height: 1.55; }
p { margin: 0 0 1.2em; line-height: 1.75; }

/* === callout 6종 통일 패턴 === */
.callout {
  border-left: 4px solid;
  padding: 14px 18px;
  border-radius: 0 8px 8px 0;
  margin: 0 0 16px;
  font-size: 0.92em;
  line-height: 1.7;
  scroll-margin-top: 20px;
}
.callout-title {
  font-weight: 700; margin: 0 0 8px; font-size: 0.94em;
  display: flex; align-items: center; gap: 6px;
}
.callout p:last-child { margin-bottom: 0; }
.callout ul { margin: 4px 0 0; padding-left: 20px; line-height: 1.75; }
.callout li { margin: 4px 0; }
.callout code { background: white; padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }
.callout strong { font-weight: 700; }
.callout details { margin-top: 12px; padding-top: 12px; border-top: 1px dashed currentColor; opacity: 0.95; }
.callout details summary { cursor: pointer; font-size: 0.86em; list-style: none; display: inline-flex; align-items: center; gap: 6px; opacity: 0.85; font-weight: 600; }
.callout details summary::-webkit-details-marker { display: none; }
.callout details summary::before { content: "▶"; font-size: 0.65em; transition: transform 0.15s; }
.callout details[open] summary::before { transform: rotate(90deg); }
.callout details .detail-text {
  margin-top: 10px; padding: 14px 18px;
  background: rgba(255,255,255,0.55); border-radius: 6px;
  font-size: 0.95em; line-height: 1.85;
  max-width: 70ch;
}
.callout details .detail-text > * + * { margin-top: 0.9em; }
.callout details .detail-text p { margin: 0; }
.callout details .detail-text ul, .callout details .detail-text ol { margin: 0; padding-left: 22px; }
.callout details .detail-text li { margin: 5px 0; line-height: 1.75; }
.callout details .detail-text strong { font-weight: 700; }
.callout details .detail-text code { background: white; padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }

.callout-info     { border-color: var(--info);      background: var(--info-bg);      color: var(--info-dark); }
.callout-info .callout-title, .callout-info strong, .callout-info li { color: var(--info-dark); }
.callout-tip      { border-color: var(--tip);       background: var(--tip-bg);       color: var(--tip-dark); }
.callout-tip .callout-title, .callout-tip strong, .callout-tip li { color: var(--tip-dark); }
.callout-important{ border-color: var(--important); background: var(--important-bg); color: var(--important-dark); }
.callout-important .callout-title, .callout-important strong, .callout-important li { color: var(--important-dark); }
.callout-warning  { border-color: var(--warning);   background: var(--warning-bg);   color: var(--warning-dark); }
.callout-warning .callout-title, .callout-warning strong, .callout-warning li { color: var(--warning-dark); }
.callout-danger   { border-color: var(--danger);    background: var(--danger-bg);    color: var(--danger-dark); }
.callout-danger .callout-title, .callout-danger strong, .callout-danger li { color: var(--danger-dark); }
.callout-note     { border-color: var(--note);      background: var(--note-bg);      color: var(--text); }

/* 📋 배경 카드 = callout-info 변종 */
.bg-card { /* uses .callout .callout-info */ }

/* 🔄 flow */
.flow-area {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 20px; margin-bottom: 20px;
  scroll-margin-top: 20px;
}
.flow-area h3 {
  font-size: 0.72em; font-weight: 700; color: var(--muted);
  margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.08em;
}
.flow-area .mermaid-wrap {
  background: white; padding: 12px; border-radius: 6px;
  display: flex; justify-content: center; overflow-x: auto;
}
.flow-area .mermaid { font-family: var(--font-sans); }

/* 🎯 권장 요약 dashboard */
.dashboard {
  background: var(--card); border: 2px solid var(--rec);
  border-radius: 10px; padding: 16px 20px; margin-bottom: 28px;
  scroll-margin-top: 20px;
}
.dashboard h3 { margin: 0 0 4px; font-size: 0.95em; color: var(--rec-dark); font-weight: 700; }
.dashboard .help { font-size: 0.78em; color: var(--muted); margin: 0 0 12px; }
.dashboard table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
.dashboard th {
  font-size: 0.7em; color: var(--muted); text-align: left; padding: 6px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border-soft);
}
.dashboard td { padding: 9px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; line-height: 1.55; }
.dashboard tr:last-child td { border-bottom: 0; }
.dashboard .q-link { color: var(--accent); text-decoration: none; font-weight: 600; }
.dashboard .q-link:hover { text-decoration: underline; }
.dashboard .rec-opt { font-weight: 500; color: var(--text); }
.dashboard .conf { font-family: var(--font-mono); color: var(--rec); letter-spacing: 1px; font-size: 0.82em; }
.dashboard .conf .empty { color: #d1d5db; }
.dashboard .reason { color: var(--muted); font-size: 0.82em; line-height: 1.45; }

/* Q 카드 */
.question {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px 26px; margin-bottom: 24px;
  scroll-margin-top: 20px;
}
.question > h2 {
  margin: 0 0 6px; font-size: 1.15em; font-weight: 700;
  line-height: 1.45; letter-spacing: -0.01em;
}
.question .q-desc { font-size: 0.88em; color: var(--muted); margin: 0 0 14px; line-height: 1.6; }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; align-items: center; }

/* 🎯 권장 mini-card — callout-tip 변종 */
.q-rec {
  border-left: 4px solid var(--rec);
  background: var(--rec-bg);
  border-radius: 0 8px 8px 0;
  padding: 12px 18px; margin-bottom: 16px;
  position: relative;
}
.q-rec .label {
  font-size: 0.7em; color: var(--rec-dark); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.q-rec .conf {
  position: absolute; top: 12px; right: 18px;
  font-family: var(--font-mono); color: var(--rec);
  letter-spacing: 1px; font-size: 0.82em;
}
.q-rec .conf .empty { color: #d1d5db; }
.q-rec .opt { font-size: 1.02em; font-weight: 600; color: var(--rec-dark); margin: 4px 0 4px; line-height: 1.5; }
.q-rec .reason { color: #047857; font-size: 0.88em; margin: 0; line-height: 1.6; }

/* 💡 왜 = callout-tip 변종 */
.q-why {
  border-left: 4px solid var(--tip);
  background: var(--tip-bg);
  border-radius: 0 8px 8px 0;
  padding: 12px 18px; margin-bottom: 16px;
  font-size: 0.9em; line-height: 1.7;
}
.q-why .why-title { font-weight: 700; color: var(--tip-dark); margin: 0 0 6px; font-size: 0.94em; }
.q-why p { margin: 4px 0; color: var(--tip-dark); line-height: 1.7; }
.q-why code { background: white; padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }
.q-why strong { color: var(--tip-dark); }
.q-why ul { margin: 4px 0 0; padding-left: 20px; }
.q-why li { color: var(--tip-dark); margin: 3px 0; line-height: 1.6; }

/* === 옵션 비교 matrix (heatmap 셀) === */
.options-matrix {
  width: 100%; border-collapse: collapse; font-size: 0.88em;
  margin: 8px 0 14px;
}
.options-matrix th, .options-matrix td {
  padding: 10px 8px; border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}
.options-matrix th {
  font-size: 0.7em; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em; text-align: center;
}
.options-matrix th:first-child, .options-matrix th:nth-child(2) { text-align: left; }
.options-matrix td { text-align: center; }
.options-matrix td:first-child, .options-matrix td:nth-child(2) { text-align: left; }
.options-matrix tr:last-child td { border-bottom: 0; }
.options-matrix tr.rec td { background: var(--rec-bg-soft); }
.options-matrix tr.rec td:first-child { color: var(--rec); font-weight: 700; }
.options-matrix .opt-name { font-weight: 500; }
.options-matrix .conf {
  font-family: var(--font-mono); color: var(--rec);
  letter-spacing: 1px; font-size: 0.82em;
}
.options-matrix .conf .empty { color: #d1d5db; }

.heat {
  display: inline-block; min-width: 36px;
  padding: 3px 8px; border-radius: 4px;
  font-weight: 600; font-size: 0.85em; line-height: 1.4;
}
.heat-low    { background: var(--low-bg);     color: var(--low); }
.heat-mid    { background: var(--mid-bg);     color: var(--mid); }
.heat-high   { background: var(--high-bg);    color: var(--high); }
.heat-ok     { background: var(--tip-bg);     color: var(--tip); }
.heat-warn   { background: var(--warning-bg); color: var(--warning); }
.heat-danger { background: var(--danger-bg);  color: var(--danger); }
.heat-bndry  { background: var(--mid-bg);     color: var(--mid); }

.status { font-size: 0.86em; white-space: nowrap; font-weight: 600; }
.status.ok { color: var(--tip); }
.status.warn { color: var(--danger); }
.status.bndry { color: var(--mid); }

/* === 옵션 detail — split card + weighted bar === */
.option-details { margin-bottom: 12px; }
.option-details > summary {
  color: var(--accent); font-size: 0.86em; cursor: pointer; padding: 8px 0;
  list-style: none; user-select: none; display: inline-flex; align-items: center; gap: 6px;
}
.option-details > summary::-webkit-details-marker { display: none; }
.option-details > summary::before { content: "▶"; font-size: 0.65em; transition: transform 0.15s; }
.option-details[open] > summary::before { transform: rotate(90deg); }
.option-details summary:hover { text-decoration: underline; }
.option-details .detail-body { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 8px 0 0; }

.opt-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.opt-card.rec { border-color: var(--rec); background: var(--rec-bg); }
.opt-card .opt-card-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px; gap: 12px; flex-wrap: wrap;
}
.opt-card h4 { margin: 0; font-size: 0.96em; font-weight: 600; line-height: 1.45; }
.opt-card .opt-conf {
  font-family: var(--font-mono); color: var(--rec);
  letter-spacing: 1px; font-size: 0.78em;
}
.opt-card .opt-conf .empty { color: #d1d5db; }
.opt-card code {
  background: var(--border-soft); padding: 1px 5px; border-radius: 3px;
  font-size: 0.92em;
}

/* weighted bar (Pros% / Cons%) */
.weighted-bar-wrap { margin: 6px 0 12px; }
.weighted-bar {
  display: flex; height: 8px; border-radius: 4px; overflow: hidden;
  background: var(--border-soft);
}
.weighted-bar-pros { background: var(--tip); }
.weighted-bar-cons { background: var(--danger); }
.weighted-bar-empty { background: var(--border-soft); }
.weighted-bar-label {
  font-size: 0.76em; color: var(--muted);
  display: flex; justify-content: space-between;
  margin-top: 4px;
}
.weighted-bar-label .pros { color: var(--tip); font-weight: 600; }
.weighted-bar-label .cons { color: var(--danger); font-weight: 600; }

/* Pros / Cons split card */
.pros-cons-split {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px; margin: 4px 0 12px;
}
@media (max-width: 640px) {
  .pros-cons-split { grid-template-columns: 1fr; }
}
.pros-cons-split .pros-col, .pros-cons-split .cons-col {
  border-radius: 8px; padding: 12px 14px;
  font-size: 0.88em; line-height: 1.65;
}
.pros-cons-split .pros-col { background: var(--tip-bg); border-left: 3px solid var(--tip); }
.pros-cons-split .cons-col { background: var(--danger-bg); border-left: 3px solid var(--danger); }
.pros-cons-split h5 {
  margin: 0 0 6px; font-size: 0.82em; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.pros-cons-split .pros-col h5 { color: var(--tip-dark); }
.pros-cons-split .cons-col h5 { color: var(--danger-dark); }
.pros-cons-split ul { margin: 0; padding-left: 18px; }
.pros-cons-split li { margin: 4px 0; line-height: 1.6; }
.pros-cons-split .pros-col li { color: var(--tip-dark); }
.pros-cons-split .cons-col li { color: var(--danger-dark); }
.opt-example {
  margin: 6px 0 0; padding: 10px 12px;
  background: var(--note-bg); border-left: 3px solid var(--note);
  border-radius: 0 6px 6px 0; font-size: 0.86em; color: var(--text);
  font-style: italic; line-height: 1.65;
}
.opt-example strong { font-style: normal; color: var(--text); }

/* === tag / lozenge / badge / chip === */
.tag {
  display: inline-block; padding: 2px 9px; border-radius: 4px;
  font-size: 0.74em; font-weight: 500; line-height: 1.5;
  background: var(--info-bg); color: var(--info);
}
.lozenge {
  display: inline-block; padding: 3px 9px; border-radius: 3px;
  font-size: 0.7em; font-weight: 700; line-height: 1.4;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.lozenge-success  { background: var(--tip-bg);       color: var(--tip); }
.lozenge-progress { background: var(--info-bg);      color: var(--info); }
.lozenge-removed  { background: var(--danger-bg);    color: var(--danger); }
.lozenge-new      { background: var(--important-bg); color: var(--important); }
.lozenge-warning  { background: var(--warning-bg);   color: var(--warning); }
.lozenge-note     { background: var(--note-bg);      color: var(--note); }
.badge {
  display: inline-block; min-width: 18px; height: 18px;
  padding: 0 6px; border-radius: 9px;
  background: var(--accent); color: white;
  font-size: 0.7em; font-weight: 700; line-height: 18px;
  text-align: center;
}
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 999px;
  font-size: 0.78em; font-weight: 500; line-height: 1.5;
  background: var(--note-bg); border: 1px solid var(--border); color: var(--text);
}

/* === gauge (conic-gradient) — confidence 강조용 === */
.gauge {
  --val: 70; --size: 56px;
  width: var(--size); height: var(--size); border-radius: 50%;
  background: conic-gradient(var(--rec) calc(var(--val) * 1%), var(--border-soft) 0);
  display: inline-grid; place-items: center; position: relative;
}
.gauge::after {
  content: ''; width: calc(var(--size) - 14px); height: calc(var(--size) - 14px);
  background: var(--card); border-radius: 50%;
  position: absolute;
}
.gauge-val { position: relative; z-index: 1; font-weight: 700; font-size: 0.82em; color: var(--rec-dark); }

/* === step indicator === */
.steps { display: flex; align-items: flex-start; gap: 0; margin: 12px 0; }
.step { flex: 1; min-width: 0; text-align: center; position: relative; padding: 0 4px; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--border-soft); color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.82em; margin: 0 auto 4px;
}
.step.active .step-dot { background: var(--accent); color: white; }
.step.done .step-dot { background: var(--rec); color: white; }
.step:not(:last-child)::after {
  content: ''; position: absolute; top: 13px; left: calc(50% + 13px); right: calc(-50% + 13px);
  height: 2px; background: var(--border-soft); z-index: -1;
}
.step.done:not(:last-child)::after { background: var(--rec); }
.step-label { font-size: 0.7em; color: var(--muted); display: block; line-height: 1.35; }

/* === stat-tile === */
.stat-tile {
  display: grid; grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  gap: 2px 14px;
  padding: 14px 18px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px;
}
.stat-tile-icon { grid-row: 1 / 3; font-size: 22px; align-self: center; }
.stat-tile-label { font-size: 0.7em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.stat-tile-value { font-size: 1.6em; font-weight: 700; line-height: 1.15; color: var(--text); }
.stat-tile-sub { font-size: 0.75em; color: var(--muted); }

/* 영향 영역 */
.q-impact { margin: 0 0 12px; }
.q-impact > summary {
  color: var(--muted); font-size: 0.84em; cursor: pointer; padding: 6px 0;
  list-style: none; display: inline-flex; align-items: center; gap: 6px;
}
.q-impact > summary::-webkit-details-marker { display: none; }
.q-impact > summary::before { content: "▶"; font-size: 0.65em; transition: transform 0.15s; }
.q-impact[open] > summary::before { transform: rotate(90deg); }
.q-impact .impact-body {
  background: var(--info-bg); border-left: 3px solid var(--accent);
  padding: 12px 14px; border-radius: 0 6px 6px 0;
  font-size: 0.86em; color: var(--info-dark); line-height: 1.7;
}
.q-impact .impact-body ul { margin: 0; padding-left: 20px; }
.q-impact .impact-body li { margin: 3px 0; }
.q-impact .impact-body code { background: white; padding: 1px 5px; border-radius: 3px; }
.q-impact .impact-mermaid { background: white; padding: 12px; border-radius: 6px; margin-top: 8px; overflow-x: auto; }

/* 선택 영역 */
.q-select { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-soft); }
.q-select h3 {
  margin: 0 0 8px; font-size: 0.72em; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
}
.q-select label {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  margin: 2px 0; cursor: pointer; border-radius: 6px; font-size: 0.9em;
  line-height: 1.55;
}
.q-select label:hover { background: var(--border-soft); }
.q-select label.rec { background: var(--rec-bg-soft); font-weight: 500; }
.q-select label.rec::after { content: " ★"; color: var(--rec); font-weight: 700; }
.q-select label input { margin: 0; flex-shrink: 0; }
.q-select .other-input {
  width: 100%; margin-top: 6px; padding: 8px 11px;
  border: 1px solid var(--border); border-radius: 6px;
  font-family: inherit; font-size: 0.88em; resize: vertical;
  min-height: 46px; display: none;
}
.q-select .other-input.visible { display: block; }
.q-select .comment-input {
  width: 100%; margin-top: 8px; padding: 8px 11px;
  border: 1px solid var(--border-soft); border-radius: 6px;
  font-family: inherit; font-size: 0.86em; resize: vertical;
  min-height: 40px; background: var(--note-bg); display: none;
}
.q-select .comment-input.visible { display: block; }

/* submit */
.submit-area {
  background: var(--card); border: 1.5px solid var(--accent);
  border-radius: 12px; padding: 22px 24px; margin-top: 28px;
  scroll-margin-top: 20px;
}
.submit-area h3 {
  margin: 0 0 12px; font-size: 0.86em; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button {
  padding: 10px 18px; border: 1px solid var(--accent); border-radius: 6px;
  font-family: inherit; font-size: 0.9em; font-weight: 500; cursor: pointer;
  background: white; color: var(--accent);
}
.actions button:hover { background: var(--info-bg); }
.actions button.action { background: var(--rec); color: white; border-color: var(--rec); }
.actions button.action:hover { background: #059669; }
.actions button.reset {
  background: white; color: var(--muted); border-color: var(--border); margin-left: auto;
}
.actions button.reset:hover { background: var(--border-soft); }
.actions button:disabled {
  background: var(--border-soft); color: var(--muted);
  border-color: var(--border); cursor: not-allowed;
}
.actions button:disabled:hover { background: var(--border-soft); }

#output {
  margin-top: 14px; background: #1f2937; color: #f9fafb; padding: 14px;
  border-radius: 6px; font-family: var(--font-mono); font-size: 0.82em;
  line-height: 1.55; white-space: pre-wrap; max-height: 300px; overflow: auto; display: none;
}
#output.visible { display: block; }

/* empty state */
.empty-state {
  padding: 24px; text-align: center; color: var(--muted);
  font-size: 0.9em; line-height: 1.6;
}
.empty-state .emoji { font-size: 1.6em; display: block; margin-bottom: 6px; }

.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--rec);
  color: white; padding: 10px 18px; border-radius: 6px; font-size: 0.86em;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }

@media (max-width: 900px) {
  body { flex-direction: column; }
  .sidebar {
    position: relative; width: 100%; height: auto;
    border-right: 0; border-bottom: 1px solid var(--border);
  }
  .main { padding: 24px 20px 60px; max-width: 100%; }
  html { font-size: 15px; }
}
  </style>
</head>
<body>

<aside class="sidebar">
  <p class="sidebar-title">진행</p>
  <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar"></div></div>
  <p class="progress-text" id="prog-text">0/{{TOTAL_Q}}</p>

  <p class="sidebar-title">목차</p>
  <ul class="nav-list">
{{SIDEBAR_NAV}}
  </ul>
</aside>

<main class="main">

<header>
  <h1>{{H1}}</h1>
  <p class="meta">{{META}}</p>
</header>

{{BG_CARD}}

{{FLOW}}

{{DASHBOARD}}

{{QUESTIONS_BLOCK}}

<section class="submit-area" id="submit">
  <h3>✏️ 결과 추출</h3>
  <div class="actions">
    <button onclick="generate()" id="btn-gen">📄 결과 생성</button>
    <button class="action" onclick="copyOutput()" id="btn-copy">📋 복사</button>
    <button class="reset" onclick="resetForm()">🔄 초기화</button>
  </div>
  <pre id="output"></pre>
</section>

<div class="toast" id="toast"></div>

</main>

<script>
const SOURCE_HTML = "{{SOURCE_HTML}}";
const TOPIC = "{{TOPIC}}";
const DATE = "{{DATE}}";
const TOTAL_Q = {{TOTAL_Q}};

// N=0 시 버튼 disable
if (TOTAL_Q === 0) {
  document.getElementById('btn-gen').disabled = true;
  document.getElementById('btn-copy').disabled = true;
}

document.querySelectorAll('input[type="radio"]').forEach(r => {
  r.addEventListener('change', () => {
    const qid = r.name;
    const ta = document.querySelector(`textarea.other-input[data-for="${qid}"]`);
    const ci = document.querySelector(`textarea.comment-input[data-for="${qid}"]`);
    if (ta) {
      if (r.value === 'other' && r.checked) ta.classList.add('visible');
      else ta.classList.remove('visible');
    }
    if (ci) {
      if (r.checked && r.value !== 'other') ci.classList.add('visible');
      else if (r.checked && r.value === 'other') ci.classList.remove('visible');
    }
    updateProgress();
  });
});
document.querySelectorAll('textarea.other-input').forEach(ta => {
  ta.addEventListener('input', () => {
    const qid = ta.dataset.for;
    const otherRadio = document.querySelector(`input[name="${qid}"][value="other"]`);
    if (ta.value.trim()) {
      otherRadio.checked = true;
      ta.classList.add('visible');
    }
    updateProgress();
  });
});

// scroll spy — 모든 section
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.nav-list a').forEach(a => a.classList.remove('active'));
      const id = e.target.id;
      const navA = document.querySelector(`.nav-list a[href="#${id}"]`);
      if (navA) navA.classList.add('active');
    }
  });
}, { rootMargin: '-30% 0px -60% 0px' });
document.querySelectorAll('section').forEach(s => observer.observe(s));

function updateProgress() {
  if (TOTAL_Q === 0) {
    document.getElementById('prog-bar').style.width = '0%';
    document.getElementById('prog-text').textContent = '0/0';
    return;
  }
  let answered = 0;
  document.querySelectorAll('.question').forEach(q => {
    const qid = q.dataset.qid;
    const checked = q.querySelector('input:checked');
    const otherText = (q.querySelector('textarea.other-input')?.value || '').trim();
    const ok = checked && (checked.value !== 'other' || otherText.length > 0);
    if (ok) answered++;
    const navA = document.querySelector(`.nav-list a[data-q="${qid}"]`);
    if (navA) navA.classList.toggle('answered', ok);
  });
  const pct = Math.round(answered / TOTAL_Q * 100);
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `${answered}/${TOTAL_Q} 답함 (${pct}%)`;
}

function generate() {
  let md = `<!-- html-decision-result -->\n# ${TOPIC} — 결정 결과\n\n`;
  md += `**출처 HTML**: \`${SOURCE_HTML}\`\n**날짜**: ${DATE}\n\n---\n\n`;
  let count = 0;
  document.querySelectorAll('.question').forEach(q => {
    const checked = q.querySelector('input:checked');
    if (!checked) return;
    const title = q.querySelector('h2').textContent;
    let answer;
    if (checked.value === 'other') {
      const ta = q.querySelector('textarea.other-input');
      answer = '기타: ' + (ta.value.trim() || '(미입력)');
    } else {
      answer = checked.parentElement.textContent.trim().replace(/\s+/g, ' ').replace(/\s*★\s*$/, '');
    }
    const comment = q.querySelector('textarea.comment-input')?.value.trim() || '';
    md += `### ${title}\n- **답**: ${answer}\n`;
    if (comment && checked.value !== 'other') {
      md += `- **코멘트**:\n${comment.split('\n').map(l => `  ${l}`).join('\n')}\n`;
    }
    md += '\n';
    count++;
  });
  if (count === 0) { showToast('⚠️ 옵션 선택 후 생성'); return; }
  const out = document.getElementById('output');
  out.textContent = md;
  out.classList.add('visible');
}

function copyOutput() {
  const text = document.getElementById('output').textContent;
  if (!text) { showToast('⚠️ 먼저 생성'); return; }
  navigator.clipboard?.writeText(text).then(() => showToast('✅ 복사 완료'));
}

function resetForm() {
  document.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
  document.querySelectorAll('textarea').forEach(t => { t.value = ''; t.classList.remove('visible'); });
  const out = document.getElementById('output');
  out.textContent = '';
  out.classList.remove('visible');
  updateProgress();
  showToast('🔄 초기화');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

if (typeof mermaid !== 'undefined') {
  try { mermaid.initialize({ startOnLoad: true, theme: 'default', fontFamily: 'Pretendard Variable, sans-serif' }); }
  catch (e) { console.error('mermaid init failed', e); }
}

window.addEventListener('load', updateProgress);
</script>

</body>
</html>
