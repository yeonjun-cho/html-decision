<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  {{MERMAID_SCRIPT}}
  <style>
:root {
  --bg: #fafafa; --card: #fff; --border: #e5e7eb; --border-soft: #f3f4f6;
  --text: #1f2937; --muted: #6b7280; --accent: #2563eb;
  --rec: #10b981; --rec-bg: #f0fdf4; --rec-bg-soft: #f7fee7; --rec-dark: #065f46;
  --low: #16a34a; --low-bg: #dcfce7; --mid: #ca8a04; --mid-bg: #fef3c7;
  --high: #dc2626; --high-bg: #fee2e2; --warn: #f59e0b; --warn-bg: #fffbeb;
  --info-bg: #eff6ff; --info-border: #bfdbfe;
}
* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
  margin: 0; background: var(--bg); color: var(--text); line-height: 1.65;
  display: flex; min-height: 100vh;
}

/* sidebar — 순수 목차 only */
.sidebar {
  position: sticky; top: 0; height: 100vh; width: 240px;
  flex-shrink: 0; padding: 28px 18px; background: var(--card);
  border-right: 1px solid var(--border); overflow-y: auto; font-size: 0.86em;
}
.sidebar-title {
  font-size: 0.68em; color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 8px;
}
.sidebar-title:not(:first-child) { margin-top: 24px; }
.progress-bar-wrap {
  background: var(--border-soft); height: 6px; border-radius: 3px;
  overflow: hidden; margin-bottom: 4px;
}
.progress-bar {
  height: 100%; background: linear-gradient(90deg, var(--rec), #059669);
  width: 0%; transition: width 0.3s;
}
.progress-text { font-size: 0.82em; color: var(--muted); }
.nav-list { list-style: none; padding: 0; margin: 0; }
.nav-list li { margin: 1px 0; }
.nav-list a {
  display: block; padding: 8px 10px; color: var(--text);
  text-decoration: none; font-size: 0.85em; border-radius: 5px;
  border-left: 2px solid transparent; transition: background 0.1s;
}
.nav-list a:hover { background: var(--border-soft); }
.nav-list a.active {
  background: var(--rec-bg); border-left-color: var(--rec);
  color: var(--rec-dark); font-weight: 500;
}
.nav-list a.answered::before { content: "✓ "; color: var(--rec); font-weight: 600; }

/* main */
.main { flex: 1; max-width: 860px; padding: 36px 40px 80px; min-width: 0; }
h1 { margin: 0 0 6px; font-size: 1.4em; font-weight: 600; }
.meta { font-size: 0.86em; color: var(--muted); margin: 0 0 24px; line-height: 1.55; }

/* 📋 배경 카드 */
.bg-card {
  background: var(--info-bg); border: 1px solid var(--info-border);
  border-radius: 10px; padding: 16px 20px; margin-bottom: 20px;
  font-size: 0.92em; scroll-margin-top: 20px;
}
.bg-card h3 { font-size: 0.9em; font-weight: 700; color: var(--accent); margin: 0 0 10px; }
.bg-card ul { margin: 0; padding-left: 22px; color: #1e40af; line-height: 1.7; }
.bg-card li { margin: 3px 0; }
.bg-card strong { color: #1e40af; }
.bg-card code { background: white; padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }
.bg-card details { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--info-border); }
.bg-card details summary {
  font-size: 0.86em; color: var(--accent); cursor: pointer; list-style: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.bg-card details summary::-webkit-details-marker { display: none; }
.bg-card details summary::before { content: "▶"; font-size: 0.65em; transition: transform 0.15s; }
.bg-card details[open] summary::before { transform: rotate(90deg); }
.bg-card details .detail-text { padding: 8px 0 0; color: #1e3a8a; font-size: 0.88em; line-height: 1.6; }

/* 🎯 권장 요약 dashboard */
.dashboard {
  background: var(--card); border: 2px solid var(--rec);
  border-radius: 10px; padding: 16px 20px; margin-bottom: 28px;
  scroll-margin-top: 20px;
}
.dashboard h3 { margin: 0 0 4px; font-size: 0.95em; color: var(--rec-dark); font-weight: 600; }
.dashboard .help { font-size: 0.78em; color: var(--muted); margin: 0 0 12px; }
.dashboard table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
.dashboard th {
  font-size: 0.7em; color: var(--muted); text-align: left; padding: 6px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border-soft);
}
.dashboard td { padding: 9px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.dashboard tr:last-child td { border-bottom: 0; }
.dashboard .q-link { color: var(--accent); text-decoration: none; font-weight: 600; }
.dashboard .q-link:hover { text-decoration: underline; }
.dashboard .rec-opt { font-weight: 500; color: var(--text); }
.dashboard .conf {
  font-family: ui-monospace, monospace; color: var(--rec);
  letter-spacing: 1px; font-size: 0.82em;
}
.dashboard .conf .empty { color: #d1d5db; }
.dashboard .reason { color: var(--muted); font-size: 0.82em; line-height: 1.4; }

/* Q 카드 */
.question {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px 26px; margin-bottom: 20px;
  scroll-margin-top: 20px;
}
.question > h2 { margin: 0 0 4px; font-size: 1.1em; font-weight: 600; }
.question .q-desc { font-size: 0.88em; color: var(--muted); margin: 0 0 14px; }

/* 🎯 권장 mini-card */
.q-rec {
  background: linear-gradient(to right, var(--rec-bg), var(--rec-bg-soft));
  border: 1.5px solid var(--rec); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 16px; position: relative;
}
.q-rec .label {
  font-size: 0.7em; color: var(--rec-dark); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.q-rec .conf {
  position: absolute; top: 12px; right: 16px;
  font-family: ui-monospace, monospace; color: var(--rec);
  letter-spacing: 1px; font-size: 0.82em;
}
.q-rec .conf .empty { color: #d1d5db; }
.q-rec .opt { font-size: 1em; font-weight: 600; color: var(--rec-dark); margin: 4px 0 4px; }
.q-rec .reason { color: #047857; font-size: 0.86em; margin: 0; line-height: 1.5; }

/* 💡 왜 이 결정 필요 */
.q-why {
  background: var(--warn-bg); border-left: 4px solid var(--warn);
  border-radius: 0 8px 8px 0; padding: 12px 16px; margin-bottom: 16px;
  font-size: 0.9em; line-height: 1.6;
}
.q-why .why-title { font-weight: 600; color: #92400e; margin: 0 0 6px; font-size: 0.94em; }
.q-why p { margin: 4px 0; color: #78350f; }
.q-why code { background: white; padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }
.q-why strong { color: #78350f; }

/* 옵션 비교 표 */
.options-table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 0.88em; }
.options-table th {
  font-size: 0.7em; color: var(--muted); text-align: left; padding: 8px 6px;
  border-bottom: 1px solid var(--border); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.options-table td {
  padding: 11px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: middle;
}
.options-table tr:last-child td { border-bottom: 0; }
.options-table tr.rec td { background: var(--rec-bg-soft); }
.options-table .star { width: 22px; text-align: center; color: var(--rec); }
.options-table .opt-name { font-weight: 500; }
.options-table .level {
  display: inline-block; font-weight: 600; width: 38px; text-align: center;
  font-size: 0.85em; padding: 2px 6px; border-radius: 4px;
}
.level.low { color: var(--low); background: var(--low-bg); }
.level.mid { color: var(--mid); background: var(--mid-bg); }
.level.high { color: var(--high); background: var(--high-bg); }
.options-table .conf {
  font-family: ui-monospace, monospace; color: var(--rec);
  letter-spacing: 1px; font-size: 0.82em;
}
.options-table .conf .empty { color: #d1d5db; }
.options-table .status { font-size: 0.86em; white-space: nowrap; }
.status.ok { color: var(--low); font-weight: 600; }
.status.warn { color: var(--high); font-weight: 600; }
.status.bndry { color: var(--mid); font-weight: 600; }

/* 옵션 detail 카드 */
.option-details { margin-bottom: 12px; }
.option-details > summary {
  color: var(--accent); font-size: 0.86em; cursor: pointer; padding: 8px 0;
  list-style: none; user-select: none; display: inline-flex; align-items: center; gap: 6px;
}
.option-details > summary::-webkit-details-marker { display: none; }
.option-details > summary::before { content: "▶"; font-size: 0.65em; transition: transform 0.15s; }
.option-details[open] > summary::before { transform: rotate(90deg); }
.option-details summary:hover { text-decoration: underline; }
.option-details .detail-body { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 8px 0 0; }
@media (min-width: 900px) { .option-details .detail-body { grid-template-columns: 1fr 1fr; } }
.opt-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; font-size: 0.86em;
}
.opt-card.rec { border-color: var(--rec); background: var(--rec-bg); }
.opt-card .opt-card-head {
  display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;
}
.opt-card h4 { margin: 0; font-size: 0.94em; font-weight: 600; }
.opt-card .opt-conf {
  font-family: ui-monospace, monospace; color: var(--rec);
  letter-spacing: 1px; font-size: 0.78em;
}
.opt-card .opt-conf .empty { color: #d1d5db; }
.opt-card .row {
  margin: 6px 0; display: flex; align-items: flex-start; gap: 8px;
  font-size: 0.86em; line-height: 1.5;
}
.opt-card .row-icon { flex-shrink: 0; margin-top: 1px; }
.opt-card .row.pros .row-text strong { color: var(--low); }
.opt-card .row.cons .row-text strong { color: var(--high); }
.opt-card .row.example .row-text { color: var(--muted); font-style: italic; }
.opt-card code {
  background: var(--border-soft); padding: 1px 4px; border-radius: 3px;
  font-size: 0.92em; font-style: normal;
}

/* 영향 영역 */
.q-impact { margin-bottom: 12px; }
.q-impact > summary {
  color: var(--muted); font-size: 0.84em; cursor: pointer; padding: 6px 0;
  list-style: none; display: inline-flex; align-items: center; gap: 6px;
}
.q-impact > summary::-webkit-details-marker { display: none; }
.q-impact > summary::before { content: "▶"; font-size: 0.65em; transition: transform 0.15s; }
.q-impact[open] > summary::before { transform: rotate(90deg); }
.q-impact .impact-body {
  background: var(--info-bg); border-left: 3px solid var(--accent);
  padding: 10px 14px; border-radius: 0 4px 4px 0; font-size: 0.84em; color: #1e40af;
}
.q-impact .impact-body ul { margin: 0; padding-left: 22px; }
.q-impact .impact-body li { margin: 2px 0; }
.q-impact .impact-body code { background: white; padding: 1px 5px; border-radius: 3px; }
.q-impact .impact-mermaid { background: white; padding: 10px; border-radius: 4px; margin-top: 6px; }

/* 선택 영역 */
.q-select { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft); }
.q-select h3 {
  margin: 0 0 8px; font-size: 0.72em; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.q-select label {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  margin: 1px 0; cursor: pointer; border-radius: 6px; font-size: 0.9em;
}
.q-select label:hover { background: var(--border-soft); }
.q-select label.rec { background: var(--rec-bg-soft); font-weight: 500; }
.q-select label.rec::after { content: " ★"; color: var(--rec); font-weight: 700; }
.q-select label input { margin: 0; }
.q-select .other-input {
  width: 100%; margin-top: 6px; padding: 7px 10px;
  border: 1px solid var(--border); border-radius: 5px;
  font-family: inherit; font-size: 0.86em; resize: vertical;
  min-height: 44px; display: none;
}
.q-select .other-input.visible { display: block; }
.q-select .comment-input {
  width: 100%; margin-top: 8px; padding: 7px 10px;
  border: 1px solid var(--border-soft); border-radius: 5px;
  font-family: inherit; font-size: 0.84em; resize: vertical;
  min-height: 38px; background: #fafafa; display: none;
}
.q-select .comment-input.visible { display: block; }

/* submit */
.submit-area {
  background: var(--card); border: 1.5px solid var(--accent);
  border-radius: 12px; padding: 22px 24px; margin-top: 28px;
  scroll-margin-top: 20px;
}
.submit-area h3 {
  margin: 0 0 12px; font-size: 0.86em; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button {
  padding: 10px 18px; border: 1px solid var(--accent); border-radius: 6px;
  font-size: 0.9em; font-weight: 500; cursor: pointer;
  background: white; color: var(--accent);
}
.actions button:hover { background: var(--info-bg); }
.actions button.action { background: var(--rec); color: white; border-color: var(--rec); }
.actions button.action:hover { background: #059669; }
.actions button.reset {
  background: white; color: var(--muted); border-color: var(--border); margin-left: auto;
}
.actions button.reset:hover { background: var(--border-soft); }
.actions button:disabled {
  background: var(--border-soft); color: var(--muted);
  border-color: var(--border); cursor: not-allowed;
}
.actions button:disabled:hover { background: var(--border-soft); }

#output {
  margin-top: 14px; background: #1f2937; color: #f9fafb; padding: 14px;
  border-radius: 6px; font-family: ui-monospace, monospace; font-size: 0.82em;
  line-height: 1.5; white-space: pre-wrap; max-height: 300px; overflow: auto; display: none;
}
#output.visible { display: block; }

/* empty state (N=0 시 등) */
.empty-state {
  padding: 24px; text-align: center; color: var(--muted);
  font-size: 0.9em; line-height: 1.6;
}
.empty-state .emoji { font-size: 1.6em; display: block; margin-bottom: 6px; }

.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--rec);
  color: white; padding: 10px 18px; border-radius: 6px; font-size: 0.86em;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }

@media (max-width: 900px) {
  body { flex-direction: column; }
  .sidebar {
    position: relative; width: 100%; height: auto;
    border-right: 0; border-bottom: 1px solid var(--border);
  }
  .main { padding: 24px; max-width: 100%; }
}
  </style>
</head>
<body>

<aside class="sidebar">
  <p class="sidebar-title">진행</p>
  <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar"></div></div>
  <p class="progress-text" id="prog-text">0/{{TOTAL_Q}}</p>

  <p class="sidebar-title">목차</p>
  <ul class="nav-list">
{{SIDEBAR_NAV}}
  </ul>
</aside>

<main class="main">

<header>
  <h1>{{H1}}</h1>
  <p class="meta">{{META}}</p>
</header>

{{BG_CARD}}

{{DASHBOARD}}

{{QUESTIONS_BLOCK}}

<section class="submit-area" id="submit">
  <h3>✏️ 결과 추출</h3>
  <div class="actions">
    <button onclick="generate()" id="btn-gen">📄 결과 생성</button>
    <button class="action" onclick="copyOutput()" id="btn-copy">📋 복사</button>
    <button class="reset" onclick="resetForm()">🔄 초기화</button>
  </div>
  <pre id="output"></pre>
</section>

<div class="toast" id="toast"></div>

</main>

<script>
const SOURCE_HTML = "{{SOURCE_HTML}}";
const TOPIC = "{{TOPIC}}";
const DATE = "{{DATE}}";
const TOTAL_Q = {{TOTAL_Q}};

// N=0 시 버튼 disable
if (TOTAL_Q === 0) {
  document.getElementById('btn-gen').disabled = true;
  document.getElementById('btn-copy').disabled = true;
}

document.querySelectorAll('input[type="radio"]').forEach(r => {
  r.addEventListener('change', () => {
    const qid = r.name;
    const ta = document.querySelector(`textarea.other-input[data-for="${qid}"]`);
    const ci = document.querySelector(`textarea.comment-input[data-for="${qid}"]`);
    if (ta) {
      if (r.value === 'other' && r.checked) ta.classList.add('visible');
      else ta.classList.remove('visible');
    }
    if (ci) {
      if (r.checked && r.value !== 'other') ci.classList.add('visible');
      else if (r.checked && r.value === 'other') ci.classList.remove('visible');
    }
    updateProgress();
  });
});
document.querySelectorAll('textarea.other-input').forEach(ta => {
  ta.addEventListener('input', () => {
    const qid = ta.dataset.for;
    const otherRadio = document.querySelector(`input[name="${qid}"][value="other"]`);
    if (ta.value.trim()) {
      otherRadio.checked = true;
      ta.classList.add('visible');
    }
    updateProgress();
  });
});

// scroll spy — 모든 section
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.nav-list a').forEach(a => a.classList.remove('active'));
      const id = e.target.id;
      const navA = document.querySelector(`.nav-list a[href="#${id}"]`);
      if (navA) navA.classList.add('active');
    }
  });
}, { rootMargin: '-30% 0px -60% 0px' });
document.querySelectorAll('section').forEach(s => observer.observe(s));

function updateProgress() {
  if (TOTAL_Q === 0) {
    document.getElementById('prog-bar').style.width = '0%';
    document.getElementById('prog-text').textContent = '0/0';
    return;
  }
  let answered = 0;
  document.querySelectorAll('.question').forEach(q => {
    const qid = q.dataset.qid;
    const checked = q.querySelector('input:checked');
    const otherText = (q.querySelector('textarea.other-input')?.value || '').trim();
    const ok = checked && (checked.value !== 'other' || otherText.length > 0);
    if (ok) answered++;
    const navA = document.querySelector(`.nav-list a[data-q="${qid}"]`);
    if (navA) navA.classList.toggle('answered', ok);
  });
  const pct = Math.round(answered / TOTAL_Q * 100);
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `${answered}/${TOTAL_Q} 답함 (${pct}%)`;
}

function generate() {
  let md = `<!-- html-decision-result -->\n# ${TOPIC} — 결정 결과\n\n`;
  md += `**출처 HTML**: \`${SOURCE_HTML}\`\n**날짜**: ${DATE}\n\n---\n\n`;
  let count = 0;
  document.querySelectorAll('.question').forEach(q => {
    const checked = q.querySelector('input:checked');
    if (!checked) return;
    const title = q.querySelector('h2').textContent;
    let answer;
    if (checked.value === 'other') {
      const ta = q.querySelector('textarea.other-input');
      answer = '기타: ' + (ta.value.trim() || '(미입력)');
    } else {
      answer = checked.parentElement.textContent.trim().replace(/\s+/g, ' ').replace(/\s*★\s*$/, '');
    }
    const comment = q.querySelector('textarea.comment-input')?.value.trim() || '';
    md += `### ${title}\n- **답**: ${answer}\n`;
    if (comment && checked.value !== 'other') {
      md += `- **코멘트**:\n${comment.split('\n').map(l => `  ${l}`).join('\n')}\n`;
    }
    md += '\n';
    count++;
  });
  if (count === 0) { showToast('⚠️ 옵션 선택 후 생성'); return; }
  const out = document.getElementById('output');
  out.textContent = md;
  out.classList.add('visible');
}

function copyOutput() {
  const text = document.getElementById('output').textContent;
  if (!text) { showToast('⚠️ 먼저 생성'); return; }
  navigator.clipboard?.writeText(text).then(() => showToast('✅ 복사 완료'));
}

function resetForm() {
  document.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
  document.querySelectorAll('textarea').forEach(t => { t.value = ''; t.classList.remove('visible'); });
  const out = document.getElementById('output');
  out.textContent = '';
  out.classList.remove('visible');
  updateProgress();
  showToast('🔄 초기화');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

if (typeof mermaid !== 'undefined') {
  try { mermaid.initialize({ startOnLoad: true, theme: 'default' }); }
  catch (e) { console.error('mermaid init failed', e); }
}

window.addEventListener('load', updateProgress);
</script>

</body>
</html>
